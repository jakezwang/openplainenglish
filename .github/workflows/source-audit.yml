name: Source audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:sources -- --output artifacts/source-audit.json
      - run: npm run check:sources -- --input data/pilots/public-service.json --output artifacts/source-audit-public-service.json
      - run: npm run check:coverage -- --output artifacts/coverage.json
      - name: Preserve source evidence for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-audit
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 90
