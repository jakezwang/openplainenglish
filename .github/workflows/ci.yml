name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - run: npm run package:firefox
      - run: npm run package:sdk
      - run: npm run check:coverage -- --output artifacts/coverage.json
      - run: npm run analyze:study -- --output artifacts/study-analysis-empty.json
      - name: Verify ZIP integrity independently
        run: for archive in release/*.zip; do unzip -t "$archive"; done
      - name: Verify package checksum
        run: sha256sum -c *.sha256
        working-directory: release
      - name: Upload packages and coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: openplainenglish-node-${{ matrix.node }}
          path: |
            release/*.zip
            release/*.sha256
            release/*.tgz
            artifacts/coverage.json
            artifacts/study-analysis-empty.json
          if-no-files-found: error
          retention-days: 14

  deploy-demo:
    name: Publish reading demo
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
