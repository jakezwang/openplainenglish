<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=440, initial-scale=1">
  <title>OpenPlainEnglish — small promotional tile</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f3eb;
      --ink: #203c39;
      --green: #1c6357;
      --muted: #576b64;
      --line: #d7ddd4;
    }
    * { box-sizing: border-box; }
    html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; background: var(--paper); }
    body { font-family: Arial, Helvetica, sans-serif; color: var(--ink); }
    .tile { position: relative; width: 440px; height: 280px; border-left: 6px solid var(--green); }
    .brand { position: absolute; top: 24px; left: 24px; right: 28px; height: 38px; display: flex; align-items: center; gap: 11px; }
    .mark { width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center; border: 1px solid var(--ink); font: 23px/1 Georgia, 'Times New Roman', serif; }
    .name { font-size: 20px; line-height: 1.2; letter-spacing: -0.4px; font-weight: 700; }
    .rule { position: absolute; top: 81px; left: 24px; right: 28px; height: 1px; background: var(--line); }
    h1 { position: absolute; top: 99px; left: 24px; margin: 0; font: 400 37px/1.08 Georgia, 'Times New Roman', serif; letter-spacing: -0.8px; }
    h1 span { display: block; }
    h1 em { font-weight: 400; color: var(--green); }
    .promise { position: absolute; top: 196px; left: 25px; right: 28px; margin: 0; font-size: 13px; line-height: 1.4; color: var(--muted); }
    .benefits { position: absolute; bottom: 23px; left: 25px; right: 28px; display: flex; align-items: center; gap: 9px; margin: 0; font-size: 11px; line-height: 1.3; color: var(--green); }
    .separator { width: 3px; height: 3px; border-radius: 50%; background: #8da79a; flex: 0 0 auto; }
    @page { size: 440px 280px; margin: 0; }
  </style>
</head>
<body>
  <main class="tile" aria-label="OpenPlainEnglish: health terms in plain words. Cited sources, local reading, open source.">
    <header class="brand">
      <span class="mark" aria-hidden="true">Aa</span>
      <span class="name">OpenPlainEnglish</span>
    </header>
    <div class="rule" aria-hidden="true"></div>
    <h1><span>Health terms,</span><span>in <em>plain words.</em></span></h1>
    <p class="promise">Keep the original words. Find the meaning.</p>
    <p class="benefits">
      <span>Cited sources</span><span class="separator" aria-hidden="true"></span>
      <span>Local reading</span><span class="separator" aria-hidden="true"></span>
      <span>Open source</span>
    </p>
  </main>
</body>
</html>
